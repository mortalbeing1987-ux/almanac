# economies, emerging market economies
key = ["DTWEXBGS", "DTWEXAFEGS", "DTWEXEMEGS"]
freq = "daily"
units = "index, Jan 2006 = 100"
use = "C"
status = "active"  # all three probed 200 CSV from runners 2026-09-28
redistribution = "open"
backfill = "full"
# Daily values published weekly (Mondays, H.10): up to 10 days old before the
# release (probe 2026-09-28), 11 when a Monday holiday moves it to Tuesday.
max_age_days = 12

