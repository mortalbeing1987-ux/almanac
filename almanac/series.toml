# Almanac series registry -- the single list of what is collected.
#
# [sources.<name>]   how to reach a source (url templates use {key})
# [[series]]         one collected series
#   id        stable id used in deliveries
#   source    a [sources] name
#   key       the source's own identifier for the series
#   freq      daily | weekly | monthly | event
#   units     what `value` means
#   use       use-case tag from docs/ALMANAC_SPEC.md (A-G)
#   status    active | tbd (source/key not verified yet -- step 0)
#   redistribution  open | restricted  (restricted = never publish values)

[sources.fred]
url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id={key}"
note = "keyless; send an honest script User-Agent (a fake browser UA timed out 2026-09-28); API key fallback = secret FRED_API_KEY"

[sources.treasury]
url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"

[sources.nyfed]
url = "https://markets.newyorkfed.org/api/rates/{key}/last/5.json"

[sources.ecb]
url = "https://data-api.ecb.europa.eu/service/data/{key}?format=csvdata&lastNObservations=5"

[sources.snb]
url = "https://data.snb.ch/api/cube/{key}/data/csv/en"

[sources.cboe]
url = "https://cdn.cboe.com/api/global/us_indices/daily_prices/{key}_History.csv"

[sources.cftc]
url = "https://www.cftc.gov/dea/newcot/deafut.txt"

[sources.fed_fomc]
url = "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"

[sources.boj]
url = "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=csv&lang=en&db=FM01&code={key}"
note = "BoJ Time-Series Data Search API, keyless CSV; full history per call (~1.3 MB), narrow with startDate in the fetcher"

[sources.rba]
url = "https://www.rba.gov.au/statistics/tables/csv/f1-data.csv"
note = "RBA statistical table F1 (money market, daily); series ids in the header rows; served as application/octet-stream"

# TBD sources: `candidates` are probed by scripts/probe_sources.py; the one that
# works from GitHub's runners becomes `url`.
[sources.mas]
url = "https://eservices.mas.gov.sg/apimg-gw/server/monthly_statistical_bulletin_non610mssql/domestic_interest_rates_daily/views/domestic_interest_rates_daily"
# MAS API gateway (APIMG): free key from https://eservices.mas.gov.sg/apimg-portal/,
# stored ONLY as the GitHub Actions secret named below and sent in `auth_header`.
secret = "MAS_API_KEY"
auth_header = "KeyId"
note = "keyless routes are gone; keyed call returns full history as JSON (~6.8 MB, ~18 s) -- filter by date in the fetcher"

# TBD sources: `candidates` are probed by scripts/probe_sources.py; the one that
# works from GitHub's runners becomes `url`.
[sources.bea]
# BEA API, International Transactions (ITA): quarterly by partner. Free key,
# stored ONLY as Actions secret BEA_API_KEY, sent as the UserID query param.
# Probe 2026-09-28: frequencies A/QNSA/QSA only (no monthly); country names
# like SouthKorea; AreaOrCountry=AllCountries returns the world total only.
url = "https://apps.bea.gov/api/data?method=GetData&DataSetName=ITA&Frequency=QSA&Year={prev_year}&ResultFormat=JSON&Indicator={key}&AreaOrCountry={area}"
secret = "BEA_API_KEY"
auth_param = "UserID"

[sources.census]
url = "TBD"
# Census international trade API (goods by country; HS/NAICS detail later).
# Keyless at low volume. Probe: South Korea (CTY_CODE 5800), one month.
candidates = [
  "https://api.census.gov/data/timeseries/intltrade/exports/hs?get=CTY_CODE,CTY_NAME,ALL_VAL_MO&time=2026-06&CTY_CODE=5800",
  "https://api.census.gov/data/timeseries/intltrade/imports/hs?get=CTY_CODE,CTY_NAME,GEN_VAL_MO&time=2026-06&CTY_CODE=5800",
  "https://api.census.gov/data/timeseries/intltrade/exports/hs?get=CTY_CODE,CTY_NAME,ALL_VAL_MO&time=2025-12",
  "https://api.census.gov/data/timeseries/intltrade/exports/hs.json",
]

# ---- A. Curve & credit -------------------------------------------------------
[[series]]
id = "UST_PAR_CURVE"
source = "treasury"
key = "daily_treasury_yield_curve"
freq = "daily"
units = "percent, one value per tenor (series id suffixed _1M.._30Y at delivery)"
use = "A"
status = "active"
redistribution = "open"

