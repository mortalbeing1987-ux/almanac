# 10:00 London on T+2 (business days). At the Tue/Wed 02:30 UTC runs the
# latest value is 5 days old every week; a UK bank holiday adds a day,
# Easter (Good Friday + Easter Monday) two. 4 days would flag it stale twice
# a week; 7 covers Easter.
max_age_days = 7

