# Almanac series registry -- the single list of what is collected.
#
# [sources.<name>]   how to reach a source (url templates use {key})
# [[series]]         one collected series
#   id        stable id used in deliveries
#   source    a [sources] name
#   key       the source's own identifier for the series
#   freq      daily | weekly | monthly | quarterly | event
#   units     what `value` means
#   use       use-case tag from docs/ALMANAC_SPEC.md (A-G)
#   status    active | tbd (source/key not verified yet -- step 0)
#   redistribution  open | restricted  (restricted = never publish values)
# optional per series:
#   max_age_days   freshness limit (default by freq: daily 4, weekly 10, monthly 45, quarterly 120)
#   lookback_days  revision re-fetch window (default by freq: daily 30, weekly 90,
#                  monthly 400, quarterly 800)
#   backfill       history depth: "full" (everything the source has) or a number
#                  of days (default 365). Raising it on a series already delivered
#                  fetches the older history once; the depth reached is recorded
#                  per id (state: backfilled_from) after a successful fetch
#   measures       several values per key: delivered as `<id>_<key>_<measure>`
#   per_key        per-key overrides of freq / max_age_days / lookback_days, e.g.
#                  weekly codes inside an otherwise daily series
#
# url templates: {key} registry key, {since} earliest date wanted (YYYY-MM-DD),
# {n} number of days wanted, {year}/{prev_year} calendar years.
# Delivered series_id: the registry id, or `<id>_<key>` when `key` is a list
# (`<id>_<key>_<measure>` when the series lists `measures`).

[sources.fred]
url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id={key}&cosd={since}"
note = "keyless; send an honest script User-Agent (a fake browser UA timed out 2026-09-28); API key fallback = secret FRED_API_KEY"

[sources.treasury]
url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"

[sources.nyfed]
url = "https://markets.newyorkfed.org/api/rates/{key}/last/{n}.json"  # n = days wanted

[sources.ecb]
url = "https://data-api.ecb.europa.eu/service/data/{key}?format=csvdata&startPeriod={since}"

[sources.snb]
url = "https://data.snb.ch/api/cube/{key}/data/csv/en"

[sources.boc]
# Bank of Canada Valet API: keyless CSV. Terms (bankofcanada.ca/terms): the
# Bank "permits you to freely use, copy, distribute and transmit its website
# content" (exceptions: bank note images, logo, third-party content).
url = "https://www.bankofcanada.ca/valet/observations/{key}/csv?start_date={since}"

[sources.boe]
# Bank of England Interactive Statistical Database (IADB): keyless CSV,
# reachable from GitHub's runners (probe 2026-09-28). Database data are
# reusable under the UK Open Government Licence v3.0. SONIA attribution
# required: "SONIA and/or SONIA Compounded Index data licensed under the Open
# Government Licence v3.0 and copyright the Governor and Company of the Bank of
# England." A direct licence is needed only for services to end-users
# (redistribution to clients, listed derivatives, clearing, valuing clients'
# portfolios). The free database copy appears by 10:00 London on the working
# day after first publication. {since} is dd/Mon/yyyy (set by the fetcher).
url = "https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&Datefrom={since}&Dateto=now&SeriesCodes={key}&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N"

[sources.cboe]
url = "https://cdn.cboe.com/api/global/us_indices/daily_prices/{key}_History.csv"

[sources.cftc]
# Legacy Commitments of Traders, futures only. deafut.txt = the latest report
# (no header, 129 columns); history_url = one zip per year from 1986, each
# holding annual.txt (same 129 columns with a header), the current year's
# updated weekly. Probe 2026-09-28: 1986..2026 all 200; 2026 zip ~1.9 MB.
url = "https://www.cftc.gov/dea/newcot/deafut.txt"
history_url = "https://www.cftc.gov/files/dea/history/deacot{year}.zip"

[sources.fed_fomc]
url = "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"

[sources.ecb_cal]
url = "https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html"

[sources.boj_cal]
url = "https://www.boj.or.jp/en/mopo/mpmsche_minu/index.htm"

[sources.rba_cal]
url = "https://www.rba.gov.au/schedules-events/board-meeting-schedules.html"

[sources.snb_cal]
url = "https://www.snb.ch/en/services-events/digital-services/event-schedule"

# US release dates. bls.gov refuses scripted clients (403), so CPI and the
# Employment Situation come from the St. Louis Fed's FRED release calendar,
# which republishes the BLS schedule ({key} = FRED release id). GDP comes from
# BEA's own release schedule.
[sources.us_cpi_cal]
url = "https://fred.stlouisfed.org/releases/calendar?rid={key}&y={year}"

[sources.us_payrolls_cal]
url = "https://fred.stlouisfed.org/releases/calendar?rid={key}&y={year}"

[sources.bea_gdp_cal]
url = "https://www.bea.gov/news/schedule/full"

[sources.mas_cal]
url = "TBD"
note = """probe 2026-09-28: MAS publishes each Monetary Policy Statement date only about a week
ahead, and its advance release calendar is filled in by JavaScript (no dates in the HTML).
No official source gives MAS decision dates 60 days out; left tbd."""

[sources.boj]
url = "https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=csv&lang=en&db=FM01&code={key}"
note = "BoJ Time-Series Data Search API, keyless CSV; full history per call (~1.3 MB), narrow with startDate in the fetcher"

[sources.rba]
url = "https://www.rba.gov.au/statistics/tables/csv/f1-data.csv"
note = "RBA statistical table F1 (money market, daily); series ids in the header rows; served as application/octet-stream"

# TBD sources: `candidates` are probed by scripts/probe_sources.py; the one that
# works from GitHub's runners becomes `url`.
[sources.mas]
url = "https://eservices.mas.gov.sg/apimg-gw/server/monthly_statistical_bulletin_non610mssql/domestic_interest_rates_daily/views/domestic_interest_rates_daily"
# MAS API gateway (APIMG): free key from https://eservices.mas.gov.sg/apimg-portal/,
# stored ONLY as the GitHub Actions secret named below and sent in `auth_header`.
secret = "MAS_API_KEY"
auth_header = "KeyId"
note = "keyless routes are gone; keyed call returns full history as JSON (~6.8 MB, ~18 s) -- filter by date in the fetcher"

# TBD sources: `candidates` are probed by scripts/probe_sources.py; the one that
# works from GitHub's runners becomes `url`.
[sources.bea]
# BEA API, International Transactions (ITA): quarterly SA by partner. Used as a
# CROSS-CHECK of the geo workbook only. Free key, stored ONLY as Actions secret
# BEA_API_KEY, sent as the UserID query param. One request per indicator:
# comma-separated areas and years (probe 2026-09-28). Replies echo UserID, so
# only BEA's error code is ever reported. Limits: 100 requests, 100 MB and 30
# errors per minute (BEA API user guide).
url = "https://apps.bea.gov/api/data?method=GetData&DataSetName=ITA&Frequency=QSA&Year={years}&ResultFormat=JSON&Indicator={key}&AreaOrCountry={areas}"
secret = "BEA_API_KEY"
auth_param = "UserID"

[sources.bea_release]
# BEA's monthly "U.S. International Trade in Goods and Services" release files.
# Keyless. File URLs are dated (e.g. /sites/default/files/2026-09/trad0726-...)
# so the fetcher reads the current link from the release page, then checks the
# workbook still has the expected table titles (`expect` per series) -- a
# layout change is an error, never "up to date". Probe 2026-09-28: July 2026
# release (published 2026-09-03) found and all expected labels present.
url = "https://www.bea.gov/data/intl-trade-investment/international-trade-goods-and-services"
base = "https://www.bea.gov"
files = { time_series = 'trad\d{4}-time-series\.xlsx', geo = 'trad\d{4}-geo-time-series\.xlsx' }

[sources.census]
# Census international trade API: monthly goods by partner, NSA, Census basis,
# USD (dollars). Free key, stored ONLY as Actions secret CENSUS_API_KEY, sent as
# the `key` query param. {flow} = exports | imports; {field} = ALL_VAL_MO
# (exports, FAS value) | GEN_VAL_MO (general imports, customs value); one request
# per flow returns every partner (repeated CTY_CODE, appended by the fetcher)
# for every month from {month}. History from 2010-01 (probe 2026-09-28).
url = "https://api.census.gov/data/timeseries/intltrade/{flow}/hs?get=CTY_CODE,CTY_NAME,{field}&time=from+{month}"
secret = "CENSUS_API_KEY"
auth_param = "key"

