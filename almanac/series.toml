# ---- F. Long-run backdrop ----------------------------------------------------
[[series]]
id = "CPI"
source = "fred"
key = ["CPIAUCSL", "CPILFESL", "UNRATE", "PAYEMS"]
freq = "monthly"
units = "per FRED"
use = "F"
status = "active"
redistribution = "open"

# CAPE dropped in step 0 (owner decision 2026-09-28): declining usefulness, and
# no stable machine-readable official source (shillerdata.com xls link moves).

# ---- G. Trade ----------------------------------------------------------------
[[series]]
id = "TRADE_TOTAL"
source = "fred"
# BoP basis, SA: exports G&S, imports G&S, balance G&S, balance goods
key = ["BOPTEXP", "BOPTIMP", "BOPGSTB", "BOPGTB"]
freq = "monthly"
units = "USD millions, seasonally adjusted"
use = "G"
status = "active"  # all four probed 200 CSV from runners 2026-09-28
redistribution = "open"

[[series]]
id = "TRADE_BILATERAL"
source = "fred"
# Census goods trade by partner (exports FAS / imports customs basis), NSA.
# FRED codes mix letter and Census-number forms; each below probed 200 CSV
# from runners 2026-09-28. South Korea: neither EXPKS nor EXP5800 exists (404).
key = [
  "EXP0004", "IMP0004",  # World
  "EXP0003", "IMP0003",  # European Union
  "EXPCA", "IMPCA",      # Canada
  "EXPMX", "IMPMX",      # Mexico
  "EXPCH", "IMPCH",      # China
  "EXPJP", "IMPJP",      # Japan
  "EXPGE", "IMPGE",      # Germany
  "EXPUK", "IMPUK",      # United Kingdom
  "EXP5830", "IMP5830",  # Taiwan
  "EXP5520", "IMP5520",  # Vietnam
  "EXP5330", "IMP5330",  # India
  "EXP4419", "IMP4419",  # Switzerland
  "EXP5590", "IMP5590",  # Singapore
]
freq = "monthly"
units = "USD millions, not seasonally adjusted"
use = "G"
status = "active"
redistribution = "open"

[[series]]
id = "TRADE_BEA"
source = "bea"
# Goods and services, exports and imports, by partner (BoP basis, quarterly SA).
# Combined G&S (ExpGdsServ) returned no rows for SouthKorea, so goods and
# services are collected separately. Delivered id: TRADE_BEA_<Indicator>_<Area>.
key = ["ExpGds", "ImpGds", "ExpServ", "ImpServ"]
areas = ["AllCountries", "EuroArea", "Canada", "Mexico", "China", "Japan", "Germany",
         "UnitedKingdom", "SouthKorea", "Taiwan", "Vietnam", "India", "Switzerland",
         "Singapore", "Europe"]
freq = "quarterly"
units = "USD millions, seasonally adjusted"
use = "G"
status = "tbd"  # -> active per the per-partner probe
redistribution = "open"
