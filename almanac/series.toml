# ---- E. Positioning & CB balance sheets --------------------------------------
[[series]]
id = "COT_FX"
source = "cftc"
# Currency futures by CFTC contract market code (names changed over time, e.g.
# IMM -> CME in 2000, POUND STERLING -> BRITISH POUND; the codes did not).
# Probe 2026-09-28: every code present in deafut.txt and the yearly zips;
# history from 1986-01-15 (EUR from 1999-01-05, AUD from 1987-01-30, GBP
# 096742 from 1988-04-29 -- the earlier GBP contract 096741 is not spliced in).
key = ["CHF", "JPY", "EUR", "AUD", "GBP", "CAD"]
contracts = { CHF = "092741", JPY = "097741", EUR = "099741", AUD = "232741", GBP = "096742", CAD = "090741" }
# Delivered id: COT_FX_<ccy>_<measure>. NC = non-commercial ("large
# speculators"); NET = long - short; OI = open interest (all).
measures = ["NC_LONG", "NC_SHORT", "NC_NET", "OI"]
freq = "weekly"
units = "contracts"
use = "E"
status = "active"
redistribution = "open"
backfill = "full"
# obs_date = the report's "as of" Tuesday; released Friday 15:30 ET, so the
# latest report is 10 days old just before the next one (Fri 02:30 UTC run),
# 11 when a US holiday moves the release to Monday (Sat 02:30 UTC run).
max_age_days = 11

[[series]]
id = "SNB_SIGHT"
source = "snb"
cube = "snbgwdchfsgw"
# D0 codes (probe 2026-09-28): TG = total sight deposits in CHF at the SNB,
# GI = sight deposits of domestic banks (UEB = other sight deposits, not
# collected). Weekly, dated the Friday, from 2009-01-09.
key = ["TG", "GI"]
freq = "weekly"
units = "CHF millions"
use = "E"
status = "active"
redistribution = "open"
backfill = "full"
# Published Mondays: before the next release the latest week is 8 days old
# (Sat 02:30 UTC run) and 10 when a Swiss holiday Monday moves it to Tuesday.
max_age_days = 10

# ---- F. Long-run backdrop ----------------------------------------------------
[[series]]
id = "CPI"
source = "fred"
# US CPI-U all items SA and NSA, core SA (BLS); unemployment rate and nonfarm
# payrolls SA (BLS Employment Situation). History (probe 2026-09-28):
# CPIAUCNS 1913, PAYEMS 1939, CPIAUCSL 1947, UNRATE 1948, CPILFESL 1957.
key = ["CPIAUCSL", "CPIAUCNS", "CPILFESL", "UNRATE", "PAYEMS"]
freq = "monthly"  # obs_date = first day of the month
units = "per FRED (index 1982-84=100; percent; thousands of persons)"
use = "F"
status = "active"
redistribution = "open"
backfill = "full"  # FRED's latest vintage, not what was known at the time (see spec)
# Revision look-back (lookback_days), per BLS:
# - seasonally adjusted CPI (CPIAUCSL, CPILFESL): seasonal factors are
#   recalculated each year with the January CPI; SA indexes of the previous
#   5 years may be revised
# - UNRATE: CPS seasonal factors re-estimated each year; the previous 5 years
#   of SA data are revised in January
# - PAYEMS: monthly estimates revised twice; the annual benchmark (with
#   January data, in February) revises 21 months of NSA data, and 5 years of
#   SA data are re-seasonally-adjusted -- so SA payrolls also need 5 years
# - CPIAUCNS: final when issued (monthly default look-back)
# 5 years + a quarter = 1920 days. A series is fetched from its earliest key's
# start, so CPIAUCNS is re-read as far back too (any change would be delivered).
# Freshness (max_age_days): the latest value (dated the 1st of its month) is
# superseded by the next release. FRED release calendar 2025-01..2026-12
# (probe 2026-09-28): CPI up to 75 days before the next release (72-74
# typical), Employment Situation up to 72 (65-68 typical), outside the
# Oct-Nov 2025 shutdown (108 and 111 days -- genuinely late, flagged stale).
# Limits = measured maximum + 3 days for weekend/holiday shifts.
[series.per_key]  # (belongs to CPI above)
CPIAUCSL = { lookback_days = 1920, max_age_days = 78 }
CPIAUCNS = { max_age_days = 78 }
CPILFESL = { lookback_days = 1920, max_age_days = 78 }
UNRATE = { lookback_days = 1920, max_age_days = 75 }
PAYEMS = { lookback_days = 1920, max_age_days = 75 }

# CAPE dropped in step 0 (owner decision 2026-09-28): declining usefulness, and
# no stable machine-readable official source (shillerdata.com xls link moves).

# ---- G. Trade ----------------------------------------------------------------
# Delivered: BEA's monthly release workbooks (time series + geo) and the Census
# API. Cross-check only (never delivered): FRED (BEA totals) and the BEA ITA API
# (geo workbook). Revisions (BEA annual revision, June 9 2026): goods revised
# from 2021 and services from 1999, plus monthly revisions of recent months --
# the workbooks hold all history, so every run compares all of it. Census: each
# June the prior three years of NSA data are recompiled; country detail is not
# revised monthly (census.gov/foreign-trade/guide/revisions.html).
# Freshness: monthly data are released ~5 weeks after the month (BEA 2026
# schedule); the latest month is 94-100 days old just before the next release.

[[series]]
id = "TRADE_BEA_M"
source = "bea_release"
file = "time_series"
sheet = "Table 1"
# Delivered id TRADE_BEA_M_<flow>_<item>: exports/imports/balance of goods and
# services (GS), goods (G, balance of payments basis), services (S). Monthly SA
# from 1992-01 (annual rows skipped).
key = ["EXP", "IMP", "BAL"]
measures = ["GS", "G", "S"]
groups = { EXP = "Exports", IMP = "Imports", BAL = "Balance" }
items = { GS = "Total", G = "Goods", S = "Services" }
expect = { "Table 1" = ["Table 1. U.S. International Trade in Goods and Services", "Exports, Imports, and Balances"] }
freq = "monthly"  # obs_date = first day of the month
units = "USD millions, seasonally adjusted; goods on a balance of payments (BoP) basis"
use = "G"
status = "active"
redistribution = "open"
backfill = "full"
lookback_days = 20000  # the whole workbook every run (services revised back to 1999)
max_age_days = 105

[[series]]
id = "TRADE_BEA_MS"
source = "bea_release"
file = "time_series"
# Services by major category, monthly SA from 1999-01: TRADE_BEA_MS_<EXP|IMP>_<CAT>.
# Tables 2 (exports) and 3 (imports) carry the same 11 categories (probe
# 2026-09-28); the total is TRADE_BEA_M_<flow>_S. BEA publishes each table as
# one consistent series from 1999 in the current presentation (EBOPS 2010);
# the older presentation (Tables 4-5, from 1992, different categories) is not
# spliced in.
key = ["EXP", "IMP"]
sheets = { EXP = "Table 2", IMP = "Table 3" }
measures = ["MAINT", "TRANSPORT", "TRAVEL", "CONSTR", "INSUR", "FIN", "IP", "TELECOM", "OTHBUS", "PERSONAL", "GOVT"]
columns = { MAINT = "Maintenance and Repair Services n.i.e.", TRANSPORT = "Transport", TRAVEL = "Travel", CONSTR = "Construction", INSUR = "Insurance Services", FIN = "Financial Services", IP = "Charges for the Use of Intellectual Property n.i.e.", TELECOM = "Telecom-munications, Computer, and Information Services", OTHBUS = "Other Business Services", PERSONAL = "Personal, Cultural, and Recreational Services", GOVT = "Government Goods and Services n.i.e." }
expect = { "Table 2" = ["Table 2. U.S. International Trade in Services by Major Category", "Exports"], "Table 3" = ["Table 3. U.S. International Trade in Services by Major Category", "Imports"] }
freq = "monthly"
units = "USD millions, seasonally adjusted; services"
use = "G"
status = "active"
redistribution = "open"
backfill = "full"
lookback_days = 20000
max_age_days = 105

[[series]]
id = "TRADE_BEA_Q"
source = "bea_release"
file = "geo"
# By partner, quarterly SA from 1999Q1: TRADE_BEA_Q_<flow>_<item>_<partner>,
# obs_date = the quarter's first day (Q2 -> YYYY-04-01). BEA: "Area data
# reflect the composition of the areas at the time of reporting" (EU).
key = ["EXP_GS", "IMP_GS", "BAL_GS", "EXP_G", "IMP_G", "BAL_G", "EXP_S", "IMP_S", "BAL_S"]
sheets = { EXP_GS = "Table 1", IMP_GS = "Table 2", BAL_GS = "Table 3", EXP_G = "Table 4", IMP_G = "Table 5", BAL_G = "Table 6", EXP_S = "Table 7", IMP_S = "Table 8", BAL_S = "Table 9" }
measures = ["AU", "CA", "CH", "CN", "DE", "EU", "GB", "IN", "JP", "KR", "MX", "SG", "TW", "VN"]
columns = { AU = "Australia", CA = "Canada", CH = "Switzerland", CN = "China", DE = "Germany", EU = "European Union", GB = "United Kingdom", IN = "India", JP = "Japan", KR = "Korea, South", MX = "Mexico", SG = "Singapore", TW = "Taiwan", VN = "Vietnam" }
expect = { "Table 1" = ["Table 1. U.S. International Trade by Selected Countries and Areas", "Exports of Goods and Services"], "Table 2" = ["Table 2. U.S. International Trade by Selected Countries and Areas", "Imports of Goods and Services"], "Table 3" = ["Table 3. U.S. International Trade by Selected Countries and Areas", "Balance on Goods and Services"], "Table 4" = ["Table 4. U.S. International Trade by Selected Countries and Areas", "Exports of Goods"], "Table 5" = ["Table 5. U.S. International Trade by Selected Countries and Areas", "Imports of Goods"], "Table 6" = ["Table 6. U.S. International Trade by Selected Countries and Areas", "Balance on Goods"], "Table 7" = ["Table 7. U.S. International Trade by Selected Countries and Areas", "Exports of Services"], "Table 8" = ["Table 8. U.S. International Trade by Selected Countries and Areas", "Imports of Services"], "Table 9" = ["Table 9. U.S. International Trade by Selected Countries and Areas", "Balance on Services"] }
freq = "quarterly"
units = "USD millions, seasonally adjusted; goods on a balance of payments (BoP) basis"
use = "G"
status = "active"
redistribution = "open"
backfill = "full"
lookback_days = 20000
# The geo workbook is reissued only with January, April, July and October data
# (probe 2026-09-28). Latest quarter's age just before the next one appeared:
# 2025Q3 254 days (Mar 12 2026, a shutdown-delayed release), 2025Q4 251 (Jun
# 9), 2026Q1 245 (Sep 3). Limit = 254 + 6 days for release-date shifts.
max_age_days = 260

[[series]]
id = "TRADE_CEN_M"
source = "census"
# Goods by partner, monthly NSA from 2010-01: TRADE_CEN_M_<EXP|IMP>_G_<partner>.
# WORLD = CTY_CODE "-" (TOTAL FOR ALL COUNTRIES), the same value fields.
# EA = Census "EURO AREA" (0025) is NOT a fixed composition. Census notices
# add members from the release that follows accession ("Change to the Euro
# Area", 2023-01-05: Croatia from the FT-900 of March 8, 2023; Bulgaria from the
# January 2026 FT-900; current members: census.gov/foreign-trade/guide/sec5.html).
# The API's history (probe 2026-09-28, sums of members, booleans only): Dec 2019
# and Jan 2020 = members at the time; Dec 2021 - Dec 2025 = members at the time
# PLUS Croatia (back-applied before its 2023 accession); from Jan 2026 incl.
# Bulgaria, not back-filled into 2025. A later annual revision that restates it
# arrives as revisions. For a fixed composition, sum the member countries.
key = ["EXP_G", "IMP_G"]
flows = { EXP_G = { flow = "exports", field = "ALL_VAL_MO" }, IMP_G = { flow = "imports", field = "GEN_VAL_MO" } }
measures = ["WORLD", "EU", "EA", "AU", "CA", "CH", "CN", "DE", "GB", "IN", "JP", "KR", "MX", "SG", "TW", "VN"]
partners = { WORLD = "-", EU = "0003", EA = "0025", AU = "6021", CA = "1220", CH = "4419", CN = "5700", DE = "4280", GB = "4120", IN = "5330", JP = "5880", KR = "5800", MX = "2010", SG = "5590", TW = "5830", VN = "5520" }
freq = "monthly"
units = "USD (dollars, not millions), not seasonally adjusted; goods, Census basis; exports FAS value, general imports customs value"
use = "G"
status = "active"
redistribution = "open"
backfill = "full"
lookback_days = 1300  # June recompiles the prior three years
max_age_days = 105

# ---- G cross-checks (fetched and compared, never delivered) --------------------
# Results go to status.json `crosschecks` (ids and dates only); a mismatch is a
# warning, never a block.
[[series]]
id = "TRADE_TOTAL_XCHECK"
source = "fred"
role = "crosscheck"
# FRED's republication of BEA's monthly totals (Table 1).
key = ["BOPTEXP", "BOPTIMP", "BOPGSTB", "BOPGTB"]
compare = "TRADE_BEA_M_{target}"
targets = { BOPTEXP = "EXP_GS", BOPTIMP = "IMP_GS", BOPGSTB = "BAL_GS", BOPGTB = "BAL_G" }
tolerance = 0.5  # USD millions (both are published in whole millions)
window_days = 1100
freq = "monthly"
units = "USD millions, seasonally adjusted"
use = "G"
status = "active"
redistribution = "open"

[[series]]
id = "TRADE_ITA_XCHECK"
source = "bea"
role = "crosscheck"
# The ITA API's quarterly SA goods/services by partner vs the geo workbook.
key = ["ExpGds", "ImpGds", "ExpServ", "ImpServ"]
measures = ["AU", "CA", "CH", "CN", "DE", "EU", "GB", "IN", "JP", "KR", "MX", "SG", "TW", "VN"]
areas = { AU = "Australia", CA = "Canada", CH = "Switzerland", CN = "China", DE = "Germany", EU = "EU", GB = "UnitedKingdom", IN = "India", JP = "Japan", KR = "SouthKorea", MX = "Mexico", SG = "Singapore", TW = "Taiwan", VN = "Vietnam" }
compare = "TRADE_BEA_Q_{target}_{measure}"
targets = { ExpGds = "EXP_G", ImpGds = "IMP_G", ExpServ = "EXP_S", ImpServ = "IMP_S" }
tolerance = 1.0
window_days = 1100
freq = "quarterly"
units = "USD millions, seasonally adjusted"
use = "G"
status = "active"
redistribution = "open"
