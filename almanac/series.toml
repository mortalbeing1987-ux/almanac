freq = "daily"  # T10Y3M, T10Y2Y; the weekly codes are set per key below
units = "per FRED (percentage points; NFCI index; ICSA claims)"
use = "C"
status = "active"
redistribution = "open"
backfill = "full"
# NFCI: weekly (Friday), released Wednesdays and re-estimated each week.
# ICSA: weekly (week ending Saturday), released Thursdays. Both are up to ~12
# days old just before a release (probe 2026-09-28: 10 and 9 days).
per_key = { NFCI = { freq = "weekly", max_age_days = 14 }, ICSA = { freq = "weekly", max_age_days = 14 } }

[[series]]
