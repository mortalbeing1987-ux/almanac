# ---- C. Regime ---------------------------------------------------------------
[[series]]
id = "VOL_INDEX"
source = "cboe"
key = ["VIX", "VIX3M", "VVIX"]
freq = "daily"
units = "index points (OHLC; deliver close as value, keep OHLC in a later version if needed)"
use = "C"
status = "active"
redistribution = "restricted"

[[series]]
id = "REGIME_FRED"
source = "fred"
key = ["T10Y3M", "T10Y2Y", "NFCI", "ICSA"]
freq = "mixed (daily/weekly per key)"
units = "per FRED"
use = "C"
status = "active"
redistribution = "open"

[[series]]
id = "USD_INDEX"
source = "fred"
# Fed H.10 nominal trade-weighted USD indexes: broad, advanced foreign
# economies, emerging market economies
key = ["DTWEXBGS", "DTWEXAFEGS", "DTWEXEMEGS"]
freq = "daily"
units = "index, Jan 2006 = 100"
use = "C"
status = "active"  # all three probed 200 CSV from runners 2026-09-28
redistribution = "open"

# ---- D. Event calendar -------------------------------------------------------
[[series]]
id = "FOMC"
source = "fed_fomc"
