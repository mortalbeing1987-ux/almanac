[[series]]
id = "SONIA"
source = "boe"
key = "IUDSOIA"  # Sterling Overnight Index Average (%), from 1997
freq = "daily"
units = "percent"
use = "B"
status = "active"
redistribution = "open"  # OGL v3.0 with attribution (see [sources.boe])
