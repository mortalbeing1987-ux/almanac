name: probe-sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe sources (status only, no data logged)
        env:
          # Owner-added Actions secrets; the probe only puts each into its
          # request (header or query param) and never prints it. An unset
          # secret -> that source is skipped, not requested.
          MAS_API_KEY: ${{ secrets.MAS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/probe_sources.py
