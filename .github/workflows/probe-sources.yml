name: probe-sources

# Step 0: check every source in almanac/series.toml is reachable from GitHub's
# runners. Writes a status table (no data values) to the run summary.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sources.py"
      - "almanac/series.toml"
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/probe_sources.py
