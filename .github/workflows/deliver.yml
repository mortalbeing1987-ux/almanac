name: deliver

# Step 2: scheduled delivery into the PRIVATE data repo.
#   Repository variable DATA_REPO  = "<owner>/<private data repo>"
#   Repository secret   DATA_REPO_TOKEN = fine-grained token, contents:write on
#                       that one repo only (added by the owner in GitHub settings)
# Weekdays after the US close, and again early in the Asian morning (after BoJ,
# MAS and RBA publish). Logs show per-source status and counts only.
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC Mon-Fri
    - cron: "30 2 * * 2-6"    # 02:30 UTC Tue-Sat
  workflow_dispatch:
    inputs:
      uses:
        description: "use-case tags to collect"
        default: "ABCDE"

permissions:
  contents: read

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check configuration
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          HAS_TOKEN: ${{ secrets.DATA_REPO_TOKEN != '' }}
        run: |
          if [ -z "$DATA_REPO" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set repository variable DATA_REPO and secret DATA_REPO_TOKEN first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          # The write token is used for this clone only and NOT left in
          # data-repo/.git/config while dependencies install and the collector
          # runs; the push step below supplies it again, in memory only.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deliver (status only, no values logged)
        env:
          MAS_API_KEY: ${{ secrets.MAS_API_KEY }}
          USES: ${{ inputs.uses || 'ABCDE' }}
        run: |
          case "$USES" in *[!A-G]*|"") echo "::error::uses must be letters A-G"; exit 1;; esac
          python -m almanac deliver --data-dir data-repo --uses "$USES"
      - name: Commit and push to the data repo
        working-directory: data-repo
        env:
          # Only this step sees the token. It goes into the remote URL given on
          # the git command line (never written to .git/config, never echoed;
          # GitHub masks the secret if git ever repeats the URL in an error).
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config user.name "almanac-bot"
          git config user.email "almanac-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          run_id=$(python -c "import json;print(json.load(open('status.json'))['run_id'])")
          git commit -q -m "almanac run $run_id"
          branch=$(git rev-parse --abbrev-ref HEAD)
          remote="https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git"
          for i in 1 2 3; do
            git push -q "$remote" "HEAD:$branch" && exit 0
            git pull -q --rebase "$remote" "$branch" || true
          done
          echo "::error::push to data repo failed"; exit 1
